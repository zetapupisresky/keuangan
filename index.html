<!doctype html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Keuangan Pribadi</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png">
<meta id="tc" name="theme-color" content="#16233B">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Space+Mono&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<style>
:root{--paper:#F6F1E4;--panel:#FFFDF8;--line:#D8CFB8;--text:#211D16;--text-mute:#635D4E;--ink:#16233B;--on-ink:#F6F1E4;--accent:#C08A2E;--accent-soft:#E9D3A0;--accent2:#2F6F62;--accent2-soft:#DCEAE4;--negative:#A63D40;--negative-soft:#F3DEDA;--on-ink-mute:#C7CEE0;--on-ink-accent:#E9D3A0;--on-ink-accent-bright:#E0AE55;--on-ink-accent2-bright:#4FA08D;--on-ink-negative:#E2837E;--on-ink-line:#2B3752;--sans:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--serif:'Fraunces',Georgia,serif;--mono:'Space Mono',ui-monospace,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--text);font:15px/1.4 var(--sans);font-variant-numeric:tabular-nums;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:var(--on-ink);display:flex;align-items:center;gap:4px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px}
header h1{flex:1;margin:0;font-size:18px}
.ib{background:none;border:0;color:var(--on-ink);padding:6px 8px;border-radius:8px}
main{max-width:720px;margin:0 auto;padding:14px}
h2{font-size:15px;margin:18px 0 8px}
.mut{color:var(--text-mute)}.in{color:var(--accent2)}.out{color:var(--negative)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.k{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.k span{display:block;color:var(--text-mute);font-size:13px}.k b{font-size:17px}
.card{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;width:100%;text-align:left}
.card small{display:block;color:var(--text-mute)}.card img{width:44px;height:44px;object-fit:cover;border-radius:6px}
.card b.a{white-space:nowrap}
.add{width:100%;padding:11px;border:1.5px dashed var(--accent2);background:none;color:var(--accent2);border-radius:10px;font-weight:600;margin:6px 0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:14px 0;color:var(--text-mute);font-size:11.5px}
nav button.on{color:var(--accent2);font-weight:700;box-shadow:inset 0 3px var(--accent)}
#login{max-width:340px;margin:12vh auto;padding:20px}
#login h1{font-size:24px;margin:0 0 4px}
label{display:block;margin:10px 0 0;font-size:13px;color:var(--text-mute)}
input,select,textarea{display:block;width:100%;padding:10px;margin-top:4px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:16px}
.pri,.ghost,.del{padding:11px 16px;border-radius:8px;border:1px solid var(--accent2);font-weight:600}
.pri{background:var(--accent);color:var(--ink)}.ghost{background:none;color:var(--accent2)}.del{border-color:var(--negative);color:var(--negative);background:none}
.row{display:flex;gap:8px;margin-top:16px}.row .pri{flex:1}
#login .pri{width:100%;margin-top:16px}
.link{background:none;border:0;color:var(--accent2);margin-top:12px;padding:0}
#sheet{position:fixed;inset:0;z-index:9;background:var(--paper);overflow:auto;padding:calc(14px + env(safe-area-inset-top)) 16px 40px}
#sheet form{max-width:560px;margin:0 auto}.pv img{max-width:100%;border-radius:8px;margin-top:6px}
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--accent);z-index:30;transition:width .4s}
.sec{border:1px solid var(--line);border-radius:10px;overflow:hidden}.ln{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;background:var(--panel)}.ln+.ln{border-top:1px solid var(--line)}.ln span{color:var(--text-mute)}.ln b{white-space:nowrap}
#bell{position:relative;font-size:18px}
#badge{position:absolute;top:-2px;right:0;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:#E5484D;color:#fff;font-size:11px;line-height:18px;font-weight:700}
#panel{position:fixed;top:calc(58px + env(safe-area-inset-top));right:10px;width:min(92vw,380px);max-height:72vh;overflow:auto;background:var(--panel);border-radius:16px;box-shadow:0 12px 32px rgba(20,35,46,.2);z-index:8}
.ph{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;font-size:17px}.ph .ib{color:var(--text)}
.ni{padding:12px 18px;border-top:1px solid var(--line)}.ni b{font-size:16px}.ni p{margin:4px 0;color:var(--text-mute)}.ni small{color:var(--text-mute)}
.ni em{font-style:normal;font-weight:700}em.High{color:var(--negative)}em.Medium{color:var(--accent)}em.Info{color:var(--text-mute)}
.dh{display:flex;justify-content:space-between;align-items:center;margin-top:4px}.dh h2{margin:0;font-size:22px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px}.stat span{color:var(--text-mute);font-size:13px}.stat b{display:block;font-size:21px;margin-top:6px}
.pc{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px 4px 12px;margin:12px 0}.pc h3{margin:10px 12px 4px;font-size:16px}.pc .ln{padding:8px 12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.cards .pc{margin:0}
.pbw{padding:8px 12px 0}.pb{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.pb i{display:block;height:100%;background:var(--accent)}.pbw small{color:var(--text-mute)}
.qa{display:flex;gap:8px;margin:0 0 12px}.qa .add{flex:1;margin:0}.stat small{display:block;color:var(--text-mute);font-size:12px;margin-top:2px}
.chip{display:inline-block;font:600 11px var(--sans);padding:2px 8px;border-radius:20px;margin-left:8px;vertical-align:1px}
.c-ok{background:var(--accent2-soft);color:var(--accent2)}.c-warn{background:var(--accent-soft);color:var(--text)}.c-bad{background:var(--negative-soft);color:var(--negative)}.c-mut{background:var(--line);color:var(--text-mute)}
.gctl{display:flex;flex-wrap:wrap;gap:8px;padding:4px 12px 0}.gs{margin:0;font-size:11.5px;flex:1;min-width:104px}.gs select{padding:6px 8px;font-size:14px;margin-top:2px}
.gb{padding:6px 12px 0}.gcap{padding:0 12px;margin:10px 0 0;font-size:13px;min-height:18px}.gh{margin:14px 0 4px;font-size:13px;color:var(--text-mute)}.gb .ln{padding:7px 0}
.dn{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.dn svg{width:150px;height:150px;flex:none}.lgs{flex:1;min-width:150px}
.lg{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0;cursor:pointer}.lg i{width:10px;height:10px;border-radius:50%;flex:none}.lg span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lg b{font-weight:600}
.hb{cursor:pointer;margin:9px 0}.hl{display:flex;justify-content:space-between;gap:8px;font-size:13px}.hl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt2{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:3px}.bt2 i{display:block;height:100%;border-radius:5px}
.ld{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:60px 20px;color:var(--text-mute)}.ld b{color:var(--text)}.sp{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--on-ink);padding:9px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90%}
#toast.s{opacity:1}

h1,h2,h3,.stat b{font-family:var(--serif);font-weight:500}
.sw{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}.swatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;box-shadow:0 0 0 1px var(--line) inset}.swatch.active{border-color:var(--text)}
.kbar{position:sticky;top:calc(56px + env(safe-area-inset-top));z-index:4;display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:12px}
.kc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 16px 18px;margin-bottom:14px}
.kh{display:flex;gap:10px;align-items:baseline;border-bottom:1px dashed var(--line);padding-bottom:10px;margin-bottom:12px}
.kh i{font:12px var(--mono);color:var(--accent);font-style:normal}.kh b{font:500 18px var(--serif)}.kh small{display:block;color:var(--text-mute);font-size:12.5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:380px){.g2{grid-template-columns:1fr}}
.ei{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}.ei-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.ei-h small{display:block;color:var(--text-mute);font-size:12px}
.tag{font:10.5px var(--mono);color:var(--accent2);background:var(--accent2-soft);padding:2px 8px;border-radius:20px}
.rs{font:11px var(--mono);color:var(--accent);background:none;border:1px solid var(--accent-soft);padding:4px 10px;border-radius:20px}
.chk{display:flex;align-items:center;gap:6px}.chk input{display:inline-block;width:auto;margin:0}
.sub{display:flex;justify-content:space-between;font:12.5px var(--mono);margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
.dis{font-size:12px;color:var(--text-mute);background:var(--accent-soft);border:1px dashed var(--line);border-radius:10px;padding:10px 14px;margin:8px 0 0}
.pill{display:inline-block;font:11.5px var(--mono);padding:4px 11px;border-radius:20px}.pill.ok{background:var(--accent2-soft);color:var(--accent2)}.pill.no{background:var(--negative-soft);color:var(--negative)}
.tk{background:var(--ink);color:var(--on-ink);border-radius:14px;overflow:hidden;margin:14px 0}.tk-top{padding:20px 22px 16px}
.eb{font:12px var(--mono);letter-spacing:.06em;color:var(--on-ink-accent);margin:0 0 6px}.tk-route{font:19px var(--serif);margin:0 0 4px}.tk-meta{font:11.5px var(--mono);color:var(--on-ink-mute);margin:0}
.perf{border-top:2px dashed var(--on-ink-line);margin:0 22px}.tk-st{padding:18px 22px 4px}.bn{font:29px var(--serif);margin:10px 0 2px}.bn.pos{color:var(--on-ink-accent2-bright)}.bn.neg{color:var(--on-ink-negative)}.bl{font-size:12.5px;color:var(--on-ink-mute);margin:0 0 14px}
.tk-b{padding:0 22px 8px}.tr2{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px solid var(--on-ink-line)}.tr2 span{color:var(--on-ink-mute)}.tr2 b{font:13px var(--mono);font-weight:400}.tr2.tot{border:0;padding-top:12px}
.tk-bd{padding:0 22px 20px}.tk-bd h3{font-size:14.5px;margin:12px 0 10px;color:var(--on-ink-accent)}.bd{margin-bottom:9px;font-size:12px;color:var(--on-ink-mute)}.bd div:first-child{display:flex;justify-content:space-between;margin-bottom:4px}.bt{height:5px;background:var(--on-ink-line);border-radius:3px;overflow:hidden}.bt i{display:block;height:100%;background:var(--on-ink-accent-bright)}
@media print{header,nav,#bar,#toast,#panel,.kbar,.add,.rs{display:none!important}body{padding:0}.tk,.kc{break-inside:avoid}}
</style></head><body>
<div id="login"><h1>Keuangan Pribadi</h1><p class="mut" id="lt">Masuk</p>
<form onsubmit="return auth(event)"><label>Username<input name="u" autocomplete="username" required></label>
<label>Password<input name="p" type="password" autocomplete="current-password" required></label>
<label id="code" hidden>Kode daftar (kosongkan untuk akun pertama)<input name="c"></label>
<p id="lerr" class="out"></p><button class="pri">Lanjut</button></form>
<button class="link" id="sw" onclick="setMode(mode==='login'?'register':'login')">Belum punya akun? Daftar</button></div>
<div id="app" hidden><header><h1>Keuangan</h1><button class="ib" id="tbtn" onclick="themePanel()" aria-label="Tema">🎨</button><button class="ib" id="bell" onclick="togglePanel()" aria-label="Notifikasi">🔔<span id="badge" hidden></span></button><button class="ib" onclick="load(true)" aria-label="Muat ulang">↻</button><button class="ib" onclick="logout()">Keluar</button></header>
<main id="main"></main>
<nav><button data-t="Ringkasan">Ringkasan</button><button data-t="Transaksi">Transaksi</button><button data-t="Rencana Liburan">Liburan</button><button data-t="Rencana Program">Program</button><button data-t="Rencana Pembelian">Pembelian</button><button data-t="Kalkulator">Kalkulator</button></nav></div>
<div id="sheet" hidden></div><div id="panel" hidden></div><div id="bar"></div><div id="toast"></div>

  const x=tr[nm]=tr[nm]||{d,s:0,due:r['Tgl Mulai']};x.s+=Math.max(0,n(r['Estimasi (Rp)'])-n(r['Aktual (Rp)']))});
 for(const nm in tr){const x=tr[nm];if(x.s>0)add('l'+nm,'Liburan '+nm,'Sisa belum lunas '+rp(x.s)+', berangkat '+wk(x.d),x.d,x.due)}
 data['Rencana Program'].rows.forEach(r=>{if(r.Status==='Selesai')return;
  add('p'+r.ID,r['Nama Program'],'Target selesai '+wk(dd(r['Target Selesai']))+', sisa anggaran '+rp(Math.max(0,n(r['Anggaran (Rp)'])-n(r['Realisasi (Rp)']))),dd(r['Target Selesai']),r['Target Selesai'])});
 if(now.getHours()>=JAM_CATAT&&!data.Transaksi.rows.some(r=>r.Tanggal===today))o.push({id:'h',t:'Catat transaksi hari ini',b:'Belum ada transaksi tercatat hari ini.',d:null,due:today,bk:'h',lvl:'Info',tag:'Pengingat'});
 return o}
const tabSaldo=ex=>data.Transaksi.rows.reduce((a,r)=>r.ID===ex?a:r.Tipe==='Tabungan'?a+(+r['Jumlah (Rp)']||0):r.Tipe==='Pengeluaran'&&r.Metode==='Tabungan'?a-(+r['Jumlah (Rp)']||0):a,0);
const LS=(k,d)=>{try{return JSON.parse(localStorage[k]||d)}catch(e){return JSON.parse(d)}};
const NEW={'Transaksi':['Transaksi Baru',r=>`${r.Tipe} - ${r.Deskripsi} ${rp(r['Jumlah (Rp)'])}`],'Rencana Liburan':['Rencana Liburan Baru',r=>`${r['Tujuan / Trip']} - ${rp(r['Estimasi (Rp)'])}`],'Rencana Program':['Rencana Program Baru',r=>`${r['Nama Program']} - ${rp(r['Anggaran (Rp)'])}`],'Rencana Pembelian':['Rencana Pembelian Baru',r=>`${r['Nama Barang']} - ${rp(r['Harga (Rp)'])}`]};
function logNew(sh,r){const [t,f]=NEW[sh],L=LS('log','[]'),b=f(r);L.unshift({t,b,ts:Date.now(),u:1});localStorage.log=JSON.stringify(L.slice(0,30));notify(t,b,'new'+sh+r.ID)}
function markKnown(sh,id){const K=LS('known','{}');(K[sh]=K[sh]||[]).push(id);localStorage.known=JSON.stringify(K)}
function scanNew(){const K=localStorage.known?LS('known','{}'):null,k={};
 for(const sh in D){k[sh]=data[sh].rows.map(r=>r.ID);if(K)data[sh].rows.forEach(r=>{if(!(K[sh]||[]).includes(r.ID))logNew(sh,r)})}
 localStorage.known=JSON.stringify(k)}
function ago(ts){const m=Math.round((Date.now()-ts)/6e4);return m<1?'baru saja':m<60?m+' menit lalu':m<1440?Math.round(m/60)+' jam lalu':Math.round(m/1440)+' hari lalu'}
function badge(){const b=$('#badge');if(!b||!data)return;const n=reminders().length+LS('log','[]').filter(x=>x.u).length;b.textContent=n;b.hidden=!n}
function togglePanel(){const p=$('#panel');if(!p.hidden&&p.dataset.k==='n'){p.hidden=true;return}p.dataset.k='n';p.hidden=false;
 const R=reminders(),L=LS('log','[]'),it=(t,b,m)=>`<div class="ni"><b>${esc(t)}</b><p>${esc(b)}</p><small>${m}</small></div>`;
 p.innerHTML=`<div class="ph"><b>🔔 Notifikasi</b><button class="ib" onclick="togglePanel()" aria-label="Tutup">✕</button></div>`+
  (R.length||L.length?R.map(x=>it(x.t,x.b,`${x.tag} · <em class="${x.lvl}">${x.lvl}</em>`)).join('')+L.map(x=>it(x.t,x.b,`Data Baru · <em class="Medium">Medium</em> · ${ago(x.ts)}`)).join('')+(L.length?'<button class="link" style="margin:8px 18px 14px" onclick="clearLog()">Hapus riwayat data baru</button>':''):'<p class="mut" style="padding:4px 18px 18px">Belum ada notifikasi.</p>');
 localStorage.log=JSON.stringify(L.map(x=>({...x,u:0})));badge()}
function clearLog(){localStorage.log='[]';$('#panel').hidden=true;togglePanel();badge()}
async function notify(t,b,tag){if(!('Notification' in window)||Notification.permission!=='granted')return;const r=await navigator.serviceWorker.ready;r.showNotification(t,{body:b,tag,icon:'icon-192.png',badge:'icon-192.png'})}
function fire(){if(!data)return;const F=LS('fired','{}'),now=Date.now();let ch=0;
 Object.keys(localStorage).forEach(k=>{if(k.startsWith('n:'))localStorage.removeItem(k)});
 reminders().forEach(x=>{const k=x.id+'|'+(x.due||'')+'|'+x.bk;if(!F[k]){F[k]=now;ch=1;notify(x.t,x.b,k)}});
 for(const k in F)if(now-F[k]>45*864e5){delete F[k];ch=1}
 if(ch)localStorage.fired=JSON.stringify(F);badge()}
async function askNotif(){if(!('Notification' in window))return toast('Browser tidak mendukung. Di iPhone, tambahkan ke Layar Utama dulu.');
 const p=await Notification.requestPermission();toast(p==='granted'?'Notifikasi aktif':'Izin notifikasi ditolak');if(p==='granted'){notify('Notifikasi aktif','Pengingat muncul saat aplikasi dibuka.','t');render()}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)fire()});
document.addEventListener('click',e=>{const p=$('#panel');if(!p.hidden&&!e.target.closest('#panel,#bell,#tbtn'))p.hidden=true});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
applyTheme();
if(tok)start();
</script></body></html>
